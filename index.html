<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sketch Strike - arena playground</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; background: #141414; overflow: hidden;
      touch-action: none; overscroll-behavior: none;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    #game { width: 100vw; height: 100vh; height: 100dvh; }
    canvas { display: block; }
    /* portrait phones: prompt to rotate instead of a squished game */
    #rotate-hint {
      display: none; position: fixed; inset: 0; z-index: 50;
      background: #f3efe3; color: #2b2b2b;
      flex-direction: column; align-items: center; justify-content: center;
      font-family: "Segoe Print", "Comic Sans MS", cursive; text-align: center;
      padding: 24px;
    }
    #rotate-hint .phone {
      width: 54px; height: 92px; border: 5px solid #2b2b2b; border-radius: 10px;
      margin-bottom: 24px; position: relative;
      animation: rot 1.8s ease-in-out infinite;
    }
    #rotate-hint .phone::after {
      content: ""; position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
      width: 8px; height: 8px; border-radius: 50%; background: #2b2b2b;
    }
    @keyframes rot {
      0%, 25% { transform: rotate(0deg); }
      65%, 100% { transform: rotate(90deg); }
    }
    #rotate-hint .t1 { font-size: 26px; margin-bottom: 8px; }
    #rotate-hint .t2 { font-size: 15px; color: #6b6b6b; }
    #rotate-hint { cursor: pointer; }
    /* manual fullscreen toggle, works on phone and desktop */
    #fs-btn {
      position: fixed; top: 10px; right: 10px; z-index: 40;
      font-family: "Segoe Print", "Comic Sans MS", cursive; font-size: 14px;
      color: #2b2b2b; background: #f3efe3;
      border: 3px solid #2b2b2b; border-radius: 10px;
      padding: 6px 12px; cursor: pointer;
    }
    /* desktop/mobile control-mode toggle */
    #mode-btn {
      position: fixed; top: 10px; right: 102px; z-index: 40;
      font-family: "Segoe Print", "Comic Sans MS", cursive; font-size: 14px;
      color: #2b2b2b; background: #f3efe3;
      border: 3px solid #2b2b2b; border-radius: 10px;
      padding: 6px 12px; cursor: pointer;
    }
    /* twin-stick touch controls */
    #touch-ui { position: fixed; inset: 0; z-index: 30; pointer-events: none; display: none; }
    .stick {
      position: absolute; width: 124px; height: 124px; border-radius: 50%;
      border: 3px solid rgba(43,43,43,.55); background: rgba(243,239,227,.25);
      pointer-events: auto; touch-action: none;
    }
    .stick .knob {
      position: absolute; left: 50%; top: 50%; width: 56px; height: 56px;
      margin: -28px 0 0 -28px; border-radius: 50%;
      background: rgba(43,43,43,.55);
    }
    #stick-left { left: 22px; bottom: 22px; }
    #stick-right { right: 22px; bottom: 22px; }
    /* TEMPORARY touch diagnostics */
    #touch-dbg {
      position: fixed; left: 8px; bottom: 8px; z-index: 60;
      background: rgba(0,0,0,.72); color: #7CFC00;
      font: 11px monospace; padding: 6px 8px; border-radius: 6px;
      white-space: pre; pointer-events: none;
    }
    /* main menu + end-of-match card: doodle paper cards */
    .card-overlay {
      position: fixed; inset: 0; z-index: 50; display: none;
      align-items: center; justify-content: center;
      background: rgba(43,43,43,.45);
    }
    .card {
      background: #f3efe3; border: 4px solid #2b2b2b; border-radius: 14px;
      padding: 26px 34px; text-align: center; max-width: 92vw;
      font-family: "Segoe Print", "Comic Sans MS", cursive; color: #2b2b2b;
      box-shadow: 6px 6px 0 rgba(43,43,43,.35);
    }
    .card h1 { margin: 0 0 2px; font-size: 34px; letter-spacing: 2px; }
    .card .sub { margin: 0 0 16px; color: #6b6b6b; font-size: 15px; }
    .card .map-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }
    .card .map-row button { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .card .map-thumb {
      width: 132px; height: 78px; object-fit: cover;
      border: 2px solid #2b2b2b; border-radius: 6px; background: #f3efe3;
    }
    .card button {
      font-family: inherit; font-size: 16px; color: #2b2b2b;
      background: #fff; border: 3px solid #2b2b2b; border-radius: 10px;
      padding: 10px 18px; cursor: pointer;
    }
    .card button.sel { background: #ffd93a; }
    .card button.big { font-size: 20px; padding: 12px 30px; background: #ffd93a; }
    .card .fine { margin: 14px 0 0; font-size: 13px; color: #6b6b6b; }
    #endcard .card h1 { font-size: 40px; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate-hint">
    <div class="phone"></div>
    <div class="t1">ROTATE YOUR PHONE</div>
    <div class="t2">or tap here - the game turns itself landscape</div>
  </div>
  <button id="fs-btn" aria-label="Toggle fullscreen">FULL</button>
  <button id="mode-btn" aria-label="Toggle control mode">DESKTOP</button>
  <div id="touch-ui">
    <div id="stick-left" class="stick"><div class="knob"></div></div>
    <div id="stick-right" class="stick"><div class="knob"></div></div>
  </div>
  <!-- TEMPORARY touch diagnostics for the phone-controller bug -->
  <div id="touch-dbg"></div>
  <div id="menu" class="card-overlay">
    <div class="card">
      <h1>SKETCH STRIKE</h1>
      <p class="sub">doodle deathmatch - you vs 2 bots</p>
      <div class="map-row" id="map-row">
        <button data-map="yard" class="sel"><img class="map-thumb" alt="Doodle Yard layout preview"><span>Doodle Yard</span></button>
        <button data-map="sky"><img class="map-thumb" alt="Sky Bridges layout preview"><span>Sky Bridges</span></button>
        <button data-map="maze"><img class="map-thumb" alt="Crate Maze layout preview"><span>Crate Maze</span></button>
      </div>
      <button id="start-btn" class="big">START FIGHT</button>
      <p class="fine">first to 7 kills wins - 5:00 on the clock<br>grab a gun, watch your fuel</p>
    </div>
  </div>
  <div id="endcard" class="card-overlay">
    <div class="card">
      <h1 id="end-title">VICTORY!</h1>
      <p class="sub" id="end-sub"></p>
      <div class="map-row">
        <button id="rematch-btn" class="big">REMATCH</button>
        <button id="tomenu-btn">MENU</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
