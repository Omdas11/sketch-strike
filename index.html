<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sketch Strike - arena playground</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; background: #141414; overflow: hidden;
      touch-action: none; overscroll-behavior: none;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    #game { width: 100vw; height: 100vh; height: 100dvh; }
    canvas { display: block; }
    /* portrait phones: prompt to rotate instead of a squished game */
    #rotate-hint {
      display: none; position: fixed; inset: 0; z-index: 50;
      background: #f3efe3; color: #2b2b2b;
      flex-direction: column; align-items: center; justify-content: center;
      font-family: "Segoe Print", "Comic Sans MS", cursive; text-align: center;
      padding: 24px;
    }
    #rotate-hint .phone {
      width: 54px; height: 92px; border: 5px solid #2b2b2b; border-radius: 10px;
      margin-bottom: 24px; position: relative;
      animation: rot 1.8s ease-in-out infinite;
    }
    #rotate-hint .phone::after {
      content: ""; position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
      width: 8px; height: 8px; border-radius: 50%; background: #2b2b2b;
    }
    @keyframes rot {
      0%, 25% { transform: rotate(0deg); }
      65%, 100% { transform: rotate(90deg); }
    }
    #rotate-hint .t1 { font-size: 26px; margin-bottom: 8px; }
    #rotate-hint .t2 { font-size: 15px; color: #6b6b6b; }
    #rotate-hint { cursor: pointer; }
    /* manual fullscreen toggle, works on phone and desktop */
    #fs-btn {
      position: fixed; top: 10px; right: 10px; z-index: 40;
      font-family: "Segoe Print", "Comic Sans MS", cursive; font-size: 14px;
      color: #2b2b2b; background: #f3efe3;
      border: 3px solid #2b2b2b; border-radius: 10px;
      padding: 6px 12px; cursor: pointer;
    }
    /* desktop/mobile control-mode toggle */
    #mode-btn {
      position: fixed; top: 10px; right: 102px; z-index: 40;
      font-family: "Segoe Print", "Comic Sans MS", cursive; font-size: 14px;
      color: #2b2b2b; background: #f3efe3;
      border: 3px solid #2b2b2b; border-radius: 10px;
      padding: 6px 12px; cursor: pointer;
    }
    /* twin-stick touch controls */
    #touch-ui { position: fixed; inset: 0; z-index: 30; pointer-events: none; display: none; }
    .stick {
      position: absolute; width: 124px; height: 124px; border-radius: 50%;
      border: 3px solid rgba(43,43,43,.55); background: rgba(243,239,227,.25);
      pointer-events: auto; touch-action: none;
    }
    .stick .knob {
      position: absolute; left: 50%; top: 50%; width: 56px; height: 56px;
      margin: -28px 0 0 -28px; border-radius: 50%;
      background: rgba(43,43,43,.55);
    }
    #stick-left { left: 22px; bottom: 22px; }
    #stick-right { right: 22px; bottom: 22px; }
    #btn-fly {
      position: absolute; right: 36px; bottom: 172px; width: 88px; height: 88px;
      border-radius: 50%; border: 3px solid #2b2b2b;
      background: rgba(255,140,46,.45); color: #2b2b2b;
      font-family: "Segoe Print", "Comic Sans MS", cursive; font-size: 18px;
      pointer-events: auto; touch-action: none; cursor: pointer;
    }
    #btn-fly.held { background: rgba(255,140,46,.9); }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate-hint">
    <div class="phone"></div>
    <div class="t1">ROTATE YOUR PHONE</div>
    <div class="t2">or tap here - the game turns itself landscape</div>
  </div>
  <button id="fs-btn" aria-label="Toggle fullscreen">FULL</button>
  <button id="mode-btn" aria-label="Toggle control mode">DESKTOP</button>
  <div id="touch-ui">
    <div id="stick-left" class="stick"><div class="knob"></div></div>
    <div id="stick-right" class="stick"><div class="knob"></div></div>
    <button id="btn-fly">FLY</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
